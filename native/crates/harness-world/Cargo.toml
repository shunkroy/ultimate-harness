[package]
name = "harness-world"
version.workspace = true
edition.workspace = true
description = "Offline world vertical slice: .hdoor V1 package, deterministic source compiler, provenance index, offline lexical pipeline, world runtime with signed branch persistence."

[dependencies]
harness-core = { path = "../harness-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
unicode-normalization = "0.1"
[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
