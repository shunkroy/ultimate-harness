[package]
name = "harness-native"
version.workspace = true
edition.workspace = true
description = "Native Harness binary: read-only status/session interop, runtime detection, deterministic engine demo."

[[bin]]
name = "harness-native"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
harness-world = { path = "../harness-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"